
name: Automatic Telegram Stock Alerts

on:
  schedule:
    # 09:00 AM and 09:15 AM IST
    - cron: "30,45 3 * * 1-5"

    # 09:30 AM to 03:15 PM IST
    - cron: "0,15,30,45 4-9 * * 1-5"

    # 03:30 PM IST
    - cron: "0 10 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance

      - name: Verify execution time
        run: |
          echo "UTC time:"
          date -u

          echo "Indian time:"
          TZ=Asia/Kolkata date

          echo "Scheduled cron:"
          echo '${{ github.event.schedule }}'

          echo "Event:"
          echo '${{ github.event_name }}'

          echo "Branch:"
          echo '${{ github.ref_name }}'

      - name: Scan stocks and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u stock_alerts.py


name: Automatic Telegram Stock Alerts

on:
  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install pandas requests yfinance

      - name: Check schedule trigger
        run: |
          echo "Triggered at UTC:"
          date -u
          echo "Cron expression:"
          echo '${{ github.event.schedule }}'
          echo "Event:"
          echo '${{ github.event_name }}'
          echo "Branch:"
          echo '${{ github.ref_name }}'

      - name: Scan stocks and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u stock_alerts.py
